<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1, user-scalable=no" />
<title>教师评价 · 儿童成长档案</title>
<link rel="stylesheet" href="home-school-common.css" />
<style>
  .eval-entry-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .eval-entry {
    min-height: 60px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--surface);
    color: var(--fg);
    padding: 13px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .eval-entry strong {
    font-size: 14px;
    line-height: 1.3;
  }
  .eval-entry.primary {
    border-color: #a7f3d0;
    background: #ecfdf5;
  }
  .eval-entry.primary strong { color: #047857; }
  .eval-progress .prog-table {
    table-layout: fixed;
    min-width: 0;
    width: 100%;
  }
  .eval-progress .prog-table th:first-child,
  .eval-progress .prog-table td:first-child {
    width: 62px;
    text-align: left;
  }
</style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">WiFi · ▮▮▮▮</span></div>
  <div class="nav-bar"><a class="back" href="growth-record.html">‹</a><div class="nav-title">教师评价</div><span></span></div>
  <div class="scroll">
    <div class="sec">评价入口</div>
    <div class="eval-entry-grid">
      <a class="eval-entry primary" href="teacher-monthly-evaluation.html">
        <strong>月度评价</strong>
      </a>
      <a class="eval-entry" href="teacher-term-evaluation.html">
        <strong>学期评价</strong>
      </a>
      <a class="eval-entry" href="growth-comprehensive-assessment.html">
        <strong>综合评估</strong>
      </a>
      <a class="eval-entry" href="teacher-message.html">
        <strong>教师寄语</strong>
      </a>
    </div>

    <div class="sec">本班幼儿进度</div>
    <div class="table-wrap eval-progress">
      <table class="prog-table">
        <thead>
          <tr><th>幼儿</th><th>本月评价</th><th>学期评估</th><th>综合评估</th><th>教师寄语</th></tr>
        </thead>
        <tbody>
          <tr><td class="name">陈小明</td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td></tr>
          <tr><td class="name">李雨萱</td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td></tr>
          <tr><td class="name">张力轩</td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td></tr>
          <tr><td class="name">王子涵</td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td></tr>
          <tr><td class="name">赵佳怡</td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell miss" title="未完成" aria-label="未完成"></span></td></tr>
          <tr><td class="name">刘浩然</td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td><td><span class="dot-cell done" title="完成" aria-label="完成"></span></td></tr>
        </tbody>
      </table>
      <div class="dot-legend" aria-label="进度状态说明">
        <span class="item"><i class="dot-cell done"></i>完成</span>
        <span class="item"><i class="dot-cell miss"></i>未完成</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>

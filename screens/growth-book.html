<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1, user-scalable=no" />
<title>成长册 · 家园共育</title>
<link rel="stylesheet" href="home-school-common.css" />
<style>
  .summary-card {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px;
  }
  .summary-card .grow { flex: 1; min-width: 0; }
  .summary-card b { font-size: 15px; }
  .summary-card .list { display: block; font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .summary-card .enter { color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; }

  /* 栏目进度表：只显示教师已经勾选的栏目 */
  .table-wrap { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #b8cbcb transparent; }
  .table-wrap::-webkit-scrollbar { display: block; height: 6px; }
  .table-wrap::-webkit-scrollbar-track { background: transparent; }
  .table-wrap::-webkit-scrollbar-thumb { background: #b8cbcb; border-radius: 999px; }
  .prog-table th:first-child { position: sticky; left: 0; z-index: 2; background: var(--accent-light); }
  .prog-table .name { position: sticky; left: 0; z-index: 1; background: var(--surface); }

  .sheet-mask { position: absolute; inset: 0; background: rgba(31,41,55,.32); opacity: 0; pointer-events: none; transition: .2s ease; z-index: 30; }
  .sheet-mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 31;
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 18px 16px 22px; transform: translateY(105%); transition: .24s ease;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .sheet-head h2 { font-size: 17px; }
  .close { border: 0; background: #f3f7f7; border-radius: 50%; width: 30px; height: 30px; font-size: 18px; color: var(--muted); }
  .sheet-list { max-height: 320px; overflow-y: auto; }
  .sheet-list::-webkit-scrollbar { display: none; }
  .check-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border: 1px solid var(--border); border-radius: 13px;
    padding: 12px; margin-bottom: 8px; font-size: 14px; font-weight: 700;
  }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); flex: 0 0 auto; }
  .check-row.blocked { opacity: .45; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .btn.ghost { border: 1px solid var(--border); background: #fff; color: var(--fg); }
  .toast {
    position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(31,41,55,.9); color: #fff; border-radius: 999px;
    padding: 9px 14px; font-size: 12px; opacity: 0; pointer-events: none; transition: .22s ease; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">WiFi · ▮▮▮▮</span></div>
  <div class="nav-bar"><a class="back" href="growth-record.html">‹</a><div class="nav-title">成长册</div><span></span></div>
  <div class="scroll">
    <div class="sec">成长册内容</div>
    <a class="summary-card" href="growth-book-edit.html">
      <span class="grow">
        <b id="sumTitle">已收录 0 项内容</b>
        <span class="list" id="sumList"></span>
      </span>
      <span class="pill" id="tplState">草稿</span>
      <span class="enter">编辑样板 ›</span>
    </a>

    <div class="action-row" style="margin-bottom:12px">
      <a class="btn" href="growth-book-sample.html">成长册样本</a>
      <button class="btn primary" id="openFinalize">全班定稿</button>
    </div>
    <div class="hint" id="finalizeGate" style="margin:-6px 0 12px" hidden>模版尚未发布，只能预览；请先在编辑样板中完整预览并发布班级模板。</div>

    <div class="chunk">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:15px;font-weight:600">班级定稿进度</div>
          <div class="hint" style="margin-top:4px" id="progressNote">各幼儿成长册开放进度</div>
        </div>
        <strong id="overall" style="color:var(--accent);font-size:20px">0%</strong>
      </div>
      <div class="progress-line"><div class="bar"><span id="overallBar" style="width:0%"></span></div></div>
    </div>

    <div class="sec">栏目进度</div>
    <div class="table-wrap">
      <table class="prog-table wide" id="bookTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="dot-legend" aria-label="栏目进度状态说明">
      <span class="item"><i class="dot-cell done"></i>完成</span>
      <span class="item"><i class="dot-cell miss"></i>未完成</span>
    </div>
    <div class="hint" style="padding:0 12px 8px">只显示在学期编册页中已经勾选的栏目。</div>
  </div>

  <div class="sheet-mask" id="sheetMask"></div>
  <div class="sheet" id="finalizeSheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>全班定稿并开放</h2>
      <button class="close" id="closeFinalize" aria-label="关闭">×</button>
    </div>
    <label class="check-row">
      <div>全选</div>
      <input type="checkbox" id="selectAll" data-ui="context.local">
    </label>
    <div class="sheet-list" id="finalizeList"></div>
    <div class="hint" id="sheetPageNote" style="margin-top:10px">问题幼儿默认跳过并保留草稿；请先处理问题，或明确跳过后定稿其余幼儿。</div>
    <div class="sheet-actions">
      <button class="btn ghost" id="cancelFinalize">取消</button>
      <button class="btn primary" id="confirmFinalize">定稿并开放</button>
    </div>
  </div>
  <div class="toast" id="toast">已定稿并开放</div>
</div>
<script src="growth-book-render.js"></script>
<script>
let config = readBookConfig();
const canFinalize = child => bookCanFinalize(child, config);
/* 主页只显示教师在编册管理面上勾选的栏目。 */
const childColumns = () => bookSections(config)
  .filter(section => section.custom || section.key === 'time' || section.key === 'task');

function renderSummary() {
  const sections = childColumns();
  document.getElementById('sumTitle').textContent = `已收录 ${sections.length} 项内容`;
  document.getElementById('sumList').textContent = sections.length
    ? sections.map(s => s.name).join(' · ')
    : '尚未收录任何内容，点击进入编辑样板';
  /* 班级模板未发布时只能预览，不能逐册定稿 */
  const published = bookPublished(config);
  document.getElementById('tplState').textContent = COMPILATION_STATUS[config.compilationStatus] || '编册中';
  document.getElementById('openFinalize').disabled = !published;
  document.getElementById('openFinalize').style.opacity = published ? '' : '.45';
  document.getElementById('finalizeGate').hidden = published;
}

function estimateText(child) {
  const est = bookPageEstimate(config, child);
  return `${est.pages} 页${est.over ? `（超过 ${BOOK_PAGE_LIMIT} 页）` : ''}`;
}

function childIssues(child) {
  const issues = [];
  bookSections(config).forEach(section => {
    if (section.custom) {
      const item = config.custom.find(entry => entry.id === section.key);
      if (sectionFilled(item, child.id) < sectionSlots(item)) issues.push(`${section.name}缺素材`);
    } else if (BOOK_CLASS_LEVEL.includes(section.key)) {
      if (!classLevelReady(section.key, config)) issues.push(`${section.name}未就绪`);
    } else if (!childSectionReady(section.key, child, config)) {
      issues.push(`${section.name}未完成`);
    }
  });
  if (bookPageEstimate(config, child).over) issues.push(`超过 ${BOOK_PAGE_LIMIT} 页`);
  return issues;
}

function renderTable() {
  const cols = childColumns();
  document.getElementById('tableHead').innerHTML =
    '<th style="text-align:left">幼儿</th>' +
    cols.map(section => `<th>${section.name}</th>`).join('');
  document.getElementById('tableBody').innerHTML = BOOK_CHILDREN.map(child => {
    const cells = cols.map(section => {
      /* 新增栏目：全部槽位交齐才算完成 */
      const item = section.custom && config.custom.find(entry => entry.id === section.key);
      const ok = section.custom
        ? sectionFilled(item, child.id) >= sectionSlots(item)
        : childSectionReady(section.key, child, config);
      return `<td><span class="dot-cell ${ok ? 'done' : 'miss'}" title="${ok ? '完成' : '未完成'}" aria-label="${ok ? '完成' : '未完成'}"></span></td>`;
    }).join('');
    return `<tr><td class="name">${child.name}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('bookTable').style.minWidth = Math.max(320, 120 + cols.length * 82) + 'px';
}

function renderProgress() {
  const published = BOOK_CHILDREN.filter(child => bookChildPublished(child, config)).length;
  const ready = BOOK_CHILDREN.filter(child => !bookChildPublished(child, config) && canFinalize(child)).length;
  const value = Math.round(published / BOOK_CHILDREN.length * 100);
  document.getElementById('overall').textContent = value + '%';
  document.getElementById('overallBar').style.width = value + '%';
  const total = bookSections(config).length;
  document.getElementById('progressNote').textContent = total
    ? `已开放 ${published}/${BOOK_CHILDREN.length} 本，另有 ${ready} 名幼儿可定稿`
    : '尚未收录任何内容，无法定稿成长册';
}

/* ---------- 全班定稿：问题幼儿置灰，教师可明确跳过 ---------- */
const mask = document.getElementById('sheetMask');
const sheet = document.getElementById('finalizeSheet');
const finalizeList = document.getElementById('finalizeList');
const selectAll = document.getElementById('selectAll');
const toast = document.getElementById('toast');

function renderSheet() {
  finalizeList.innerHTML = BOOK_CHILDREN.map(child => {
    const published = bookChildPublished(child, config);
    const ok = canFinalize(child) && !published;
    const issues = childIssues(child);
    return `<label class="check-row${ok ? '' : ' blocked'}">
      <div>${child.name}<div style="font-size:11px;font-weight:400;color:var(--muted);margin-top:3px">${estimateText(child)} · ${published ? '已定稿开放' : (issues.join('；') || '内容齐备')}</div></div>
      <input type="checkbox" class="child-check" data-ui="context.local" data-child="${child.id}" ${ok ? 'checked' : 'disabled'}>
    </label>`;
  }).join('');
  finalizeList.querySelectorAll('.child-check').forEach(item => item.addEventListener('change', syncSelectAll));
  syncSelectAll();
}
const availableChecks = () => Array.from(finalizeList.querySelectorAll('.child-check:not(:disabled)'));
function syncSelectAll() {
  const list = availableChecks();
  selectAll.checked = list.length > 0 && list.every(item => item.checked);
  selectAll.disabled = list.length === 0;
}
selectAll.addEventListener('change', () => {
  availableChecks().forEach(item => { item.checked = selectAll.checked; });
});

function openSheet() { renderSheet(); mask.classList.add('show'); sheet.classList.add('show'); sheet.setAttribute('aria-hidden','false'); }
function closeSheet() { mask.classList.remove('show'); sheet.classList.remove('show'); sheet.setAttribute('aria-hidden','true'); }
document.getElementById('openFinalize').addEventListener('click', openSheet);
document.getElementById('closeFinalize').addEventListener('click', closeSheet);
document.getElementById('cancelFinalize').addEventListener('click', closeSheet);
mask.addEventListener('click', closeSheet);

document.getElementById('confirmFinalize').addEventListener('click', () => {
  const selected = availableChecks().filter(item => item.checked);
  if (!selected.length) {
    toast.textContent = '请至少选择 1 名幼儿';
  } else {
    const skipped = BOOK_CHILDREN.filter(child => !bookChildPublished(child, config) && !selected.some(item => item.dataset.child === child.id));
    if (skipped.length && !window.confirm(`将跳过 ${skipped.length} 名问题幼儿，所选 ${selected.length} 名定稿后永久锁定并向家长开放。确认继续？`)) return;
    selected.forEach(item => {
      if (!config.publishedChildren.includes(item.dataset.child)) config.publishedChildren.push(item.dataset.child);
    });
    writeBookConfig(config);
    toast.textContent = `已定稿并开放 ${selected.length} 本；App 内通知将发给当前监护人`;
    closeSheet();
    renderAll();
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
});

function renderAll() {
  config = readBookConfig();
  renderSummary();
  renderTable();
  renderProgress();
}
renderAll();
// 从编辑样板返回时刷新
window.addEventListener('pageshow', renderAll);
</script>
</body>
</html>

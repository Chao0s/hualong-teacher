<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, user-scalable=no">
<title>学期编册 · 成长册</title>
<link rel="stylesheet" href="home-school-common.css">
<link rel="stylesheet" href="growth-book-viewer.css">
<style>
  .preview-book{width:300px;height:auto;aspect-ratio:210 / 297;margin:0 auto 10px}.preview-label{font-size:11px;color:var(--muted);font-weight:500}
  .preview-controls{width:300px;margin:0 auto}
  .section-list{display:grid;gap:9px;margin-bottom:18px}
  .section-row{display:flex;align-items:center;gap:11px;padding:5px 12px 5px 14px;background:#fff;border:1px solid var(--border);border-radius:13px}
  .section-row input{width:19px;height:19px;accent-color:var(--accent);flex:0 0 auto}
  .section-link{display:flex;align-items:center;gap:10px;min-height:46px;flex:1;color:var(--fg);text-decoration:none}
  .section-link b{flex:1;font-size:14px}.section-link .go{font-size:20px;line-height:1;color:var(--muted)}
  .lock-button{width:100%;margin-top:12px}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--fg)}
  .toast{position:absolute;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:rgba(31,41,55,.92);color:#fff;padding:9px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">WiFi · ▮▮▮▮</span></div>
  <div class="nav-bar"><a class="back" href="growth-book.html">‹</a><div class="nav-title">2026 春季学期编册</div><span></span></div>
  <div class="scroll">
    <div class="sec">实时预览 <span class="preview-label">陈小明</span></div>
    <div class="book preview-book" id="book"></div>
    <div class="controls preview-controls">
      <button class="nav-btn" id="prev" aria-label="上一页">‹</button>
      <div class="page-indicator" id="indicator">1 / 1</div>
      <button class="nav-btn" id="next" aria-label="下一页">›</button>
    </div>

    <div class="sec">栏目管理 <a class="more" id="addSection" href="growth-book-section-edit.html?new=1">＋ 新建栏目</a></div>
    <div class="section-list" id="outline"></div>
    <button class="btn primary lock-button" id="lock" data-ui="growth_book_compilation.status">锁定编册</button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script src="growth-book-render.js"></script>
<script>
const config = readBookConfig();
config.compilationStatus = config.compilationStatus || 'e1';
const previewChild = BOOK_CHILDREN[0];
const locked = () => config.compilationStatus === 'e2';
const viewer = initBookViewer({
  book: document.getElementById('book'),
  indicator: document.getElementById('indicator'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next')
});

function manageableSections() {
  return bookOutline(config).filter(item => item.custom || item.key === 'time' || item.key === 'task');
}

function sectionHref(item) {
  if (item.custom) {
    return item.item && item.item.sectionStatus === 'd2'
      ? `growth-book-section-materials.html?id=${item.key}`
      : `growth-book-section-edit.html?id=${item.key}`;
  }
  return item.key === 'time' ? 'growth-book-time-manage.html' : 'growth-book-task-manage.html';
}

function render(keepPage = false) {
  document.getElementById('outline').innerHTML = manageableSections().map(item => `
    <div class="section-row">
      <input type="checkbox" data-toggle-section="${item.key}" data-custom="${item.custom ? '1' : '0'}"
        data-ui="growth_book_compilation.enabled_sections"${item.on ? ' checked' : ''}${locked() ? ' disabled' : ''}>
      <a class="section-link" href="${sectionHref(item)}"><b>${item.name}</b><span class="go">›</span></a>
    </div>`).join('');
  viewer.load(previewChild.name, config, keepPage, previewChild);
  const on = locked();
  const lockButton = document.getElementById('lock');
  lockButton.disabled = on;
  lockButton.textContent = on ? '已锁定' : '锁定编册';
  document.getElementById('addSection').style.pointerEvents = on ? 'none' : '';
  document.getElementById('addSection').style.opacity = on ? '.4' : '';
}

document.getElementById('outline').addEventListener('change', event => {
  const checkbox = event.target.closest('[data-toggle-section]');
  if (!checkbox || locked()) return;
  const key = checkbox.dataset.toggleSection;
  if (checkbox.dataset.custom === '1') {
    const section = (config.custom || []).find(item => item.id === key);
    if (section) section.enabled = checkbox.checked;
  } else {
    const selected = new Set(config.selected || BOOK_ORDER);
    checkbox.checked ? selected.add(key) : selected.delete(key);
    config.selected = BOOK_ORDER.filter(item => selected.has(item));
  }
  writeBookConfig(config);
  render(true);
  toast(checkbox.checked ? '栏目已加入成长册' : '栏目已从成长册隐藏');
});

document.getElementById('lock').addEventListener('click', () => {
  const timeEnabled = (config.selected || []).includes('time');
  const ungrouped = timeEnabled ? (config.material || []).filter(item => !item.topicId) : [];
  const drafts = (config.custom || []).filter(item => item.enabled !== false && item.sectionStatus !== 'd2');
  if (ungrouped.length) return toast(`还有 ${ungrouped.length} 项在园活动未分节`);
  if (drafts.length) return toast(`还有 ${drafts.length} 个已勾选栏目未发布`);
  if (!window.confirm('锁定后本学期的栏目与入册内容不可再修改。确认锁定？')) return;
  config.compilationStatus = 'e2';
  writeBookConfig(config);
  render(true);
  toast('编册已锁定');
});

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
render();
</script>
</body>
</html>

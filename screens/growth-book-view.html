<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1, user-scalable=no">
<title>成长册 · 家园社共育</title>
<link rel="stylesheet" href="home-school-common.css">
<link rel="stylesheet" href="growth-book-viewer.css">
<style>
  .child-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:12px}.child-bar strong{font-size:15px}.child-bar .meta{font-size:11px;color:var(--muted);margin-top:3px}.ready-tag{background:var(--green-light);color:var(--green);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">WiFi · ▮▮▮▮</span></div>
  <div class="nav-bar"><a class="back" href="growth-book.html">‹</a><div class="nav-title">成长册预览</div><span></span></div>
  <div class="scroll" style="padding-bottom:20px">
    <div class="child-bar">
      <div><strong id="childName" data-ui="growth_book.child">—</strong><div class="meta" data-ui="growth_book.period">中二班 · 2026 春季学期</div></div>
      <span class="ready-tag" id="bookStatus" data-ui="growth_book.status">可预览</span>
    </div>
    <div class="book" id="book"></div>
    <div class="controls">
      <button class="nav-btn" id="prev" aria-label="上一页">‹</button>
      <div class="page-indicator" id="indicator">1 / 1</div>
      <button class="nav-btn" id="next" aria-label="下一页">›</button>
    </div>
  </div>
</div>
<script src="growth-book-render.js"></script>
<script>
const config = readBookConfig();
const params = new URLSearchParams(location.search);
const child = BOOK_CHILDREN.find(item => item.id === params.get('child')) || BOOK_CHILDREN[0];
document.getElementById('childName').textContent = child.name;
document.getElementById('bookStatus').textContent = bookChildPublished(child, config) ? '已定稿' : '可预览';
const viewer = initBookViewer({
  book: document.getElementById('book'),
  indicator: document.getElementById('indicator'),
  prev: document.getElementById('prev'),
  next: document.getElementById('next')
});
viewer.load(child.name, config, false, child);
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1, user-scalable=no" />
<title>综合评估结果 · 儿童成长档案</title>
<style>
  :root {
    --bg:#f0f5f5; --surface:#fff; --fg:#1a1916; --muted:#868686; --border:#e0e8e8;
    --accent:#189b91; --accent-dark:#067e76; --accent-light:#e8f5f4;
    --green:#4b9a5a; --green-light:#eaf5ed; --amber:#feaf06; --amber-light:#fff7e3; --red:#e05243; --red-light:#fff0ed;
    --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{display:flex;justify-content:center;min-height:100vh;background:transparent;font-family:var(--font);color:var(--fg);-webkit-font-smoothing:antialiased}
  .phone{width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:40px;position:relative}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 28px 8px;font-size:13px;font-weight:600}
  .nav-bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 12px 12px}
  .nav-bar a{display:grid;place-items:center;width:36px;height:36px;color:var(--fg);text-decoration:none}
  .nav-title{text-align:center;font-size:17px;font-weight:600}
  .mini-menu{position:absolute;top:43px;right:18px;width:74px;height:30px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-around;font-size:14px;z-index:20}
  .scroll{flex:1;overflow-y:auto;padding:0 16px 28px;scrollbar-width:thin;scrollbar-color:#b8cbcb transparent}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-track{background:transparent}
  .scroll::-webkit-scrollbar-thumb{background:#b8cbcb;border-radius:999px}
  .chunk{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
  .child-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#0f766e,#189b91);color:#fff;border:0}
  .child-card h1{font-size:22px;line-height:1.15}.child-card p{font-size:12px;color:rgba(255,255,255,.88);margin-top:6px;line-height:1.45}
  .badge{border-radius:999px;background:rgba(255,255,255,.18);padding:6px 10px;font-size:12px;font-weight:800;white-space:nowrap}
  .sec{font-size:16px;font-weight:750;margin:18px 0 10px}
  .radar-wrap{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center}
  .radar{width:180px;height:180px}.axis{stroke:#d7e4e4;stroke-width:1}.grid{fill:none;stroke:#d7e4e4;stroke-width:1}.shape{fill:rgba(24,155,145,.22);stroke:var(--accent);stroke-width:2.4}.dot{fill:var(--accent-dark)}
  .legend{display:flex;flex-direction:column;gap:8px}.metric{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid var(--border);padding-bottom:7px}.metric:last-child{border-bottom:0}.metric strong{font-size:13px}.metric span:last-child{font-weight:800;color:var(--accent-dark)}
  .tab-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#e3eded;border-radius:999px;padding:4px;margin:14px 0 4px}
  .tab-switch button{border:0;background:transparent;border-radius:999px;padding:8px 0;font:inherit;font-size:13px;font-weight:750;color:var(--muted);cursor:pointer}
  .tab-switch button.on{background:#fff;color:var(--accent-dark);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .detail-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
  .detail-title{font-size:15px;font-weight:800}.detail-avg{font-size:12px;font-weight:800;color:var(--accent-dark)}
  .detail-row{padding:11px 0;border-bottom:1px solid var(--border)}
  .detail-row:last-child{border-bottom:0}
  .detail-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;font-weight:700;line-height:1.4;margin-bottom:8px}
  .detail-name .none{font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto}
  /* 只读李克特选项栏：与填写页样式一致，但不可点选 */
  .scale-view{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .scale-view span{height:28px;border:1px solid var(--border);border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;color:var(--muted)}
  .scale-view span.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 12px;text-align:center;font-size:13px;font-weight:750;color:var(--fg);text-decoration:none}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
<div class="phone">
  <div class="status-bar"><span>9:41</span><span style="font-size:12px">WiFi · ▮▮▮▮</span></div>
  <div class="mini-menu"><span>•••</span><span>○</span></div>
  <div class="nav-bar">
    <a href="growth-comprehensive-assessment.html" aria-label="返回综合评估"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="nav-title">综合评估结果</div>
    <span></span>
  </div>
  <div class="scroll">
    <section class="chunk child-card">
      <div>
        <h1 id="childName">陈小明</h1>
        <p id="childMeta">中二班 · 2026 春季综合评估</p>
      </div>
      <div class="badge">已完成</div>
    </section>

    <div class="tab-switch" role="tablist">
      <button class="on" id="tabResult" role="tab" aria-selected="true">评估结果</button>
      <button id="tabDetail" role="tab" aria-selected="false">明细</button>
    </div>

    <div id="panelResult">
      <div class="sec">五大领域雷达图</div>
      <section class="chunk radar-wrap">
        <svg class="radar" viewBox="0 0 200 200" aria-label="五大领域雷达图">
          <g id="grid"></g>
          <polygon id="radarShape" class="shape" points=""></polygon>
          <g id="dots"></g>
        </svg>
        <div class="legend" id="legend"></div>
      </section>
    </div>

    <div id="panelDetail" hidden>
      <div class="sec">评估明细</div>
      <div id="detailList"></div>
    </div>

    <div class="btn-row">
      <a class="btn" href="comprehensive-assessment-form.html">继续评估</a>
      <a class="btn primary" href="growth-comprehensive-assessment.html">返回进度</a>
    </div>
  </div>
</div>
<script src="assessment-store.js"></script>
<script>
AssessStore.seedIfEmpty();

const params = new URLSearchParams(location.search);
let childId = params.get('child');
if (!ASSESS_CHILDREN.some(c => c.id === childId)) childId = 'chen';

const record = (AssessStore.read() || {})[childId] || null;
const scores = record ? record.scores : {};
const labels = ASSESS_SCALE.map(d => d.name);
const averages = AssessStore.domainAverages(scores);
const status = AssessStore.statusOf(record);

document.getElementById('childName').textContent = AssessStore.childName(childId);
document.getElementById('childMeta').textContent =
  status === 'done' ? `中二班 · 2026 春季综合评估 · ${AssessStore.TOTAL} 题已完成`
  : status === 'draft' ? `中二班 · 2026 春季综合评估 · 已填写 ${record.rated}/${AssessStore.TOTAL} 题`
  : '中二班 · 2026 春季综合评估 · 尚未开始填写';
document.querySelector('.badge').textContent =
  status === 'done' ? '已完成' : status === 'draft' ? '草稿' : '未完成';

const center = { x: 100, y: 100 };
const maxR = 72;
function point(index, value = 5) {
  const angle = -Math.PI / 2 + index * Math.PI * 2 / labels.length;
  const radius = maxR * value / 5;
  return [center.x + Math.cos(angle) * radius, center.y + Math.sin(angle) * radius];
}
function drawGrid() {
  let html = '';
  [1,2,3,4,5].forEach(level => {
    const pts = labels.map((_, index) => point(index, level).join(',')).join(' ');
    html += `<polygon class="grid" points="${pts}"></polygon>`;
  });
  labels.forEach((label, index) => {
    const edge = point(index, 5);
    const text = point(index, 5.78);
    html += `<line class="axis" x1="${center.x}" y1="${center.y}" x2="${edge[0]}" y2="${edge[1]}"></line>`;
    html += `<text x="${text[0]}" y="${text[1]}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#555">${label}</text>`;
  });
  document.getElementById('grid').innerHTML = html;
}
function renderRadar() {
  drawGrid();
  const points = averages.map((avg, index) => point(index, avg || 0));
  document.getElementById('radarShape').setAttribute('points', points.map(p => p.join(',')).join(' '));
  document.getElementById('dots').innerHTML = points
    .map(p => `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3.6"></circle>`).join('');
  document.getElementById('legend').innerHTML = labels.map((label, index) => `
    <div class="metric"><strong>${label}</strong><span>${averages[index] ? averages[index].toFixed(1) : '未评'}</span></div>
  `).join('');
}
function renderDetail() {
  document.getElementById('detailList').innerHTML = ASSESS_SCALE.map((domain, di) => `
    <section class="chunk">
      <div class="detail-head">
        <div class="detail-title">${domain.name}</div>
        <div class="detail-avg">${averages[di] ? `平均 ${averages[di].toFixed(1)}` : '未评'}</div>
      </div>
      ${domain.items.map(item => {
        const score = scores[item.id];
        return `<div class="detail-row">
          <div class="detail-name">
            <span>${item.name}</span>
            ${score ? '' : '<span class="none">未评</span>'}
          </div>
          <div class="scale-view" role="img" aria-label="${item.name} 评分 ${score || '未评'}">
            ${[1,2,3,4,5].map(num => `<span class="${score === num ? 'on' : ''}">${num}</span>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </section>
  `).join('');
}

const tabResult = document.getElementById('tabResult');
const tabDetail = document.getElementById('tabDetail');
const panelResult = document.getElementById('panelResult');
const panelDetail = document.getElementById('panelDetail');
function select(showDetail) {
  tabDetail.classList.toggle('on', showDetail);
  tabResult.classList.toggle('on', !showDetail);
  tabDetail.setAttribute('aria-selected', String(showDetail));
  tabResult.setAttribute('aria-selected', String(!showDetail));
  panelDetail.hidden = !showDetail;
  panelResult.hidden = showDetail;
}
tabResult.addEventListener('click', () => select(false));
tabDetail.addEventListener('click', () => select(true));

renderRadar();
renderDetail();
select(false);
</script>
</body>
</html>
